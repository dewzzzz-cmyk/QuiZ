<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>QuestAR · Сокровище капитана Флинта</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a-scene embedded
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; cameraParametersUrl: ../space/data/camera_para.dat;"
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true;">

    <!-- Сцена 1: карта сокровищ -->
    <a-marker id="marker-0" type="pattern" url="markers/scene1.patt" emitevents="true">
      <a-entity id="obj-0" visible="false">
        <a-plane color="#e8d5a3" width="1.2" height="0.9" rotation="-90 0 0"></a-plane>
        <a-text value="X" color="#c0392b" align="center" width="6" rotation="-90 0 0" position="0.25 0.01 -0.1"></a-text>
        <a-cylinder color="#f1c40f" radius="0.18" height="0.04" position="-0.25 0.4 0.1" rotation="90 0 0"
                    animation="property: rotation; to: 90 360 0; loop: true; dur: 2500; easing: linear"></a-cylinder>
      </a-entity>
    </a-marker>

    <!-- Сцена 2: компас -->
    <a-marker id="marker-1" type="pattern" url="markers/scene2.patt" emitevents="true">
      <a-entity id="obj-1" visible="false">
        <a-cylinder color="#8e5a2b" radius="0.5" height="0.1"></a-cylinder>
        <a-cylinder color="#fdf6e3" radius="0.42" height="0.11"></a-cylinder>
        <a-entity position="0 0.08 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: easeInOutSine">
          <a-cone color="#c0392b" radius-bottom="0.07" height="0.35" position="0 0 -0.17" rotation="-90 0 0"></a-cone>
          <a-cone color="#34495e" radius-bottom="0.07" height="0.35" position="0 0 0.17" rotation="90 0 0"></a-cone>
        </a-entity>
      </a-entity>
    </a-marker>

    <!-- Сцена 3: сундук -->
    <a-marker id="marker-2" type="pattern" url="markers/scene3.patt" emitevents="true">
      <a-entity id="obj-2" visible="false">
        <a-box color="#7b4a1e" width="0.9" height="0.45" depth="0.55" position="0 0.225 0"></a-box>
        <a-sphere color="#f1c40f" radius="0.1" position="-0.15 0.47 0"></a-sphere>
        <a-sphere color="#f1c40f" radius="0.1" position="0.12 0.47 0.08"></a-sphere>
        <a-sphere color="#e74c3c" radius="0.07" position="0.05 0.5 -0.1"></a-sphere>
        <!-- Крышка вращается вокруг задней кромки -->
        <a-entity id="chest-lid" position="0 0.45 -0.275">
          <a-box color="#8e5a2b" width="0.92" height="0.12" depth="0.57" position="0 0.06 0.285"></a-box>
          <a-box color="#f1c40f" width="0.12" height="0.1" depth="0.02" position="0 0.02 0.575"></a-box>
        </a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div id="hud">
    <div id="progress"><span></span><span></span><span></span></div>
    <div id="hint"></div>
  </div>

  <div id="toast" hidden></div>

  <div id="riddle" class="panel" hidden>
    <p id="riddle-text"></p>
    <div id="riddle-options"></div>
  </div>

  <div id="start" class="screen">
    <h1 id="start-title"></h1>
    <p id="start-intro"></p>
    <button id="start-btn">Начать квест</button>
  </div>

  <div id="finale" class="screen" hidden>
    <h1>🎉 Сокровище найдено!</h1>
    <p id="finale-text"></p>
    <button id="restart-btn">Играть ещё раз</button>
  </div>

  <button id="demo-btn" hidden>Симулировать маркер</button>

  <script src="quest.js"></script>
  <script src="quest-link.js"></script>
  <script src="game.js"></script>
</body>
</html>
